# 6D configuration.
#
# Constants are held in workflows/six_d/build_6d.py for backward compatibility
# with the existing 6D BO scripts. This YAML records the resumable-state
# location (`.local/six_d/current/`) and the parameters that a future
# continuation must not silently change.

tunable_params: ["Ab", "kb", "eField", "lifetime", "tran_diff", "long_diff"]
lower: [0.75, 0.03, 0.49, 400.0, 3.0e-6, 1.0e-6]
upper: [0.90, 0.08, 0.51, 6000.0, 15.0e-6, 1.0e-5]
nominal: [0.80, 0.0486, 0.50, 2200.0, 8.8e-6, 4.0e-6]

n_events: 176
sobol_n_initial: 72
sobol_seed: 20260812
bo_iterations: 100
bo_seed: 20260812

# Resumable state — all future 6D continuation runs write here.
state_root: ".local/six_d/current"
target_npz: ".local/two_d/target.npz"

# Trust-region BO_TR (invoked via `continue_bo.py --mode trust_region`).
bo_tr_iterations: 100
bo_tr_seed: 20260830
tr_length_init: 0.40
tr_length_max: 0.80
tr_length_min: 0.025
tr_success_tolerance: 3
tr_failure_tolerance: 6
tr_expand_factor: 2.0
tr_shrink_factor: 0.5
tr_stagnation_extra_failures: 12
tr_ard_weight_clip: [0.1, 10.0]
tr_improvement_absolute: 1.0
tr_improvement_relative: 1.0e-4
